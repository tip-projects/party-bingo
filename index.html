
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.I.P. BINGO</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --yellow: #FFC50B;
  --black: #000000;
  --gray: #808285;
  --white: #FFFFFF;
}

body {
  margin: 0;
  padding: 28px 14px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: var(--white);
  color: var(--black);
}

.container {
  max-width: 460px;
  margin: auto;
}

.tag {
  display: inline-block;
  padding: 8px 14px;
  background: var(--yellow);
  border: 2px solid var(--black);
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

h1 {
  margin: 16px 0 5px;
  font-size: clamp(30px, 8vw, 40px);
  font-weight: 900;
  letter-spacing: -1px;
}

.subtitle {
  color: var(--gray);
  font-size: 14px;
  line-height: 1.5;
}

.progress-wrap {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  font-size: 12px;
  font-weight: bold;
}

.progress-track {
  height: 8px;
  margin-top: 7px;
  overflow: hidden;
  background: #EEEEEE;
  border: 1px solid var(--black);
  border-radius: 20px;
}

.progress-fill {
  width: 0;
  height: 100%;
  background: var(--yellow);
  transition: width .25s ease;
}

.bingo {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin: 16px 0;
}

.cell {
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 3px;
  border: 2px solid var(--gray);
  border-radius: 10px;
  background: var(--white);
  color: var(--black);
  font-size: clamp(9px, 2.7vw, 12px);
  font-weight: 600;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: transform .2s, opacity .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}

.cell:active {
  transform: scale(.92);
}

.cell.marked {
  background: var(--yellow);
  border-color: var(--black);
}

.cell.free {
  background: var(--black);
  border-color: var(--black);
  color: var(--yellow);
  font-weight: 900;
}

.cell.free.marked {
  background: var(--yellow);
  color: var(--black);
}

.cell.vanish {
  animation: vanish .3s ease forwards;
  pointer-events: none;
}

.cell.winning {
  animation: winningPulse .55s ease-in-out infinite alternate;
}

@keyframes vanish {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.12); opacity: .6; }
  100% { transform: scale(0); opacity: 0; }
}

@keyframes winningPulse {
  from { box-shadow: 0 0 0 0 var(--yellow); }
  to { box-shadow: 0 0 0 4px var(--yellow); }
}

#message {
  min-height: 26px;
  margin: 14px 0;
  font-size: 15px;
  font-weight: bold;
}

.bingo-button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 2px solid var(--black);
  border-radius: 12px;
  background: var(--yellow);
  color: var(--black);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .15s, background .15s;
}

.bingo-button:active {
  transform: scale(.97);
}

.bingo-button:hover {
  background: var(--black);
  color: var(--yellow);
}

.secondary {
  background: var(--white);
  color: var(--black);
  border-color: var(--gray);
}

.secondary:hover {
  background: var(--gray);
  color: var(--white);
}

.footer {
  margin-top: 22px;
  color: var(--gray);
  font-size: 12px;
}

/* Winning popup */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0, 0, 0, .75);
  backdrop-filter: blur(5px);
}

.modal.show {
  display: flex;
}

.modal-card {
  position: relative;
  width: 100%;
  max-width: 370px;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 25px 20px 22px;
  background: var(--white);
  color: var(--black);
  border: 3px solid var(--black);
  border-radius: 22px;
  box-shadow: 7px 7px 0 var(--yellow);
  animation: popIn .35s ease both;
}

@keyframes popIn {
  0% { transform: scale(.75); opacity: 0; }
  75% { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.close-modal {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 36px;
  height: 36px;
  border: 2px solid var(--black);
  border-radius: 50%;
  background: var(--yellow);
  color: var(--black);
  font-size: 23px;
  line-height: 1;
  cursor: pointer;
}

.win-label {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  background: var(--yellow);
  border: 1px solid var(--black);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}

.modal h2 {
  margin: 14px 0 5px;
  font-size: 30px;
  line-height: 1.1;
}

.modal-subtitle {
  margin-bottom: 16px;
  color: var(--gray);
  font-size: 13px;
}

.meme-image {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  min-height: 235px;
  padding: 15px 12px;
  overflow: hidden;
  background: var(--yellow);
  color: var(--black);
  border: 2px solid var(--black);
  border-radius: 14px;
}

.meme-top {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}

.meme-gif {
  display: block;
  width: 100%;
  max-width: 300px;
  height: 210px;
  object-fit: contain;
  border-radius: 10px;
  background: var(--white);
}

.meme-gif[hidden] {
  display: none;
}

.gif-fallback {
  display: none;
  max-width: 280px;
  padding: 20px 10px;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.5;
}

.meme-caption {
  max-width: 290px;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.meme-bottom {
  color: #333333;
  font-size: 10px;
  font-weight: bold;
}

.modal .bingo-button {
  margin-top: 16px;
}

.modal .secondary {
  margin-top: 8px;
}

body.modal-open {
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="container">

  <h1>T.I.P. BINGO</h1>
  <p class="subtitle">
        get five in a row to win!
  </p>

  <div class="progress-wrap">
    <span>your progress</span>
    <span id="progressText">0 / 24</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="bingo" id="board"></div>

  <p id="message" aria-live="polite">
    good luck, T.I.P.ians!
  </p>

  <button class="bingo-button" onclick="newCard()">
    ↻ reset card
  </button>

  <button class="bingo-button secondary" onclick="shareGame()">
    ↗ share with friends
  </button>

  <p class="footer">thank you for playing!</p>
</main>

<!-- Winning popup -->
<div class="modal" id="winModal"
     role="dialog" aria-modal="true"
     aria-labelledby="modalTitle">
  <div class="modal-card">
    <button class="close-modal" id="closeModal"
            aria-label="Close popup">&times;</button>

    <span class="win-label">BINGO! 🎉</span>
    <h2 id="modalTitle"></h2>
    <p class="modal-subtitle">
      GALING GALING NAMAN NIYAN SIYA 
    </p>

    <div class="meme-image">
      <div class="meme-top" id="memeTop">POV: YOU WON</div>

      <img id="memeGif" class="meme-gif"
           src="" alt="Funny student reaction GIF">

      <div id="gifFallback" class="gif-fallback">
        GIF is taking a nap 😭<br>
        but YOU still won!
      </div>

      <div class="meme-caption" id="memeCaption">
        finally, a win this semester
      </div>

      <div class="meme-bottom">Congrats, friend</div>
    </div>

    <button class="bingo-button" onclick="newCard()">
      ↻ play again
    </button>

    <button class="bingo-button secondary" onclick="closeModal()">
      back to board
    </button>
  </div>
</div>

<script>
const prompts = [
  "nangutang sa plaza",
  "kumakain sa class",
  "laging late",
  "nanghihingi ng notes",
  "laging tulog sa class",
  "nagsasabing 'last na to'",
  "walang dalang ballpen",
  "nagtatanong kung may quiz",
  "laging nasa canteen",
  "may baong iced coffee",
  "nagcha-charge sa classroom",
  "nagtatanong kung uwian na",
  "natutulog kahit exam",
  "nagpapa-send ng PPT",
  "madalas may chika",
  "laging lowbat",
  "nagpapanggap na gets",
  "nagpapasa ng activity last minute",
  "nagti-TikTok sa hallway",
  "artistahin",
  "nag-aaya mag-plaza",
  "nagtatanong kung required pumasok",
  "nagcha-chat ng 'asan na kayo?'",
  "nag-aaral lang pag may quiz"
];

/*
  Replace these sample image URLs with direct GIF URLs
  from GIPHY or Tenor if you prefer different memes.
  External GIFs require an internet connection.
*/
const memes = [
  {
    top: "POV: MAY BINGO KA NA",
    gif: "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
    caption: "main character yarnch??"
  },
  {
    top: "ME AFTER ONE WIN",
    gif: "https://media.giphy.com/media/g9582DNuQppxC/giphy.gif",
    caption: "sana all"
  },
  {
    top: "THE GROUP CHAT RN",
    gif: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
    caption: "GUYS MAY BINGO AKO"
  },
  {
    top: "AFTER ALL THAT",
    gif: "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif",
    caption: "at least may isang bagay na natapos"
  },
  {
    top: "LUCKY DAY MO",
    gif: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
    caption: "sana pati sa quiz ganito"
  },
  {
    top: "ABSOLUTE CINEMA",
    gif: "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif",
    caption: "kaya niyo 'yon??"
  }
];

const board = document.getElementById("board");
const message = document.getElementById("message");
const modal = document.getElementById("winModal");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const memeGif = document.getElementById("memeGif");
const gifFallback = document.getElementById("gifFallback");

let cells = [];
let hasWon = false;
let lastMemeIndex = -1;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function newCard() {
  modal.classList.remove("show");
  document.body.classList.remove("modal-open");

  board.innerHTML = "";
  cells = [];
  hasWon = false;

  const shuffled = shuffle(prompts.filter(p => p !== "FREE ⭐"));

  for (let i = 0; i < 25; i++) {
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.type = "button";

    if (i === 12) {
      cell.textContent = "FREE ★";
      cell.classList.add("free", "marked");
      cell.setAttribute("aria-pressed", "true");
    } else {
      const promptIndex = i < 12 ? i : i - 1;
      cell.textContent = shuffled[promptIndex];
      cell.setAttribute("aria-pressed", "false");
    }

    cell.addEventListener("click", () => {
      if (i === 12 || hasWon || cell.classList.contains("marked")) {
        return;
      }

      cell.classList.add("marked");
      cell.setAttribute("aria-pressed", "true");

      // The square disappears, but remains marked for win checking.
      cell.classList.add("vanish");

      updateProgress();
      checkBingo();
    });

    board.appendChild(cell);
    cells.push(cell);
  }

  message.textContent = "good luck, T.I.P.ians!";
  updateProgress();
}

function updateProgress() {
  const marked = cells.filter(
    cell => cell.classList.contains("marked")
  ).length - 1;

  progressText.textContent = `${marked} / 24`;
  progressFill.style.width = `${(marked / 24) * 100}%`;
}

function checkBingo() {
  const lines = [];

  for (let i = 0; i < 5; i++) {
    lines.push(
      [0, 1, 2, 3, 4].map(j => i * 5 + j),
      [0, 1, 2, 3, 4].map(j => j * 5 + i)
    );
  }

  lines.push(
    [0, 6, 12, 18, 24],
    [4, 8, 12, 16, 20]
  );

  const winningLine = lines.find(line =>
    line.every(i => cells[i].classList.contains("marked"))
  );

  if (winningLine && !hasWon) {
    hasWon = true;
    message.textContent = "BINGO!!!!!";

    winningLine.forEach(i => {
      cells[i].classList.remove("vanish");
      cells[i].classList.add("winning");
    });

    showRandomMeme();
  } else if (!hasWon) {
    message.textContent = "";
  }
}

function showRandomMeme() {
  let index = Math.floor(Math.random() * memes.length);

  if (memes.length > 1 && index === lastMemeIndex) {
    index = (index + 1) % memes.length;
  }

  lastMemeIndex = index;

  const meme = memes[index];

  document.getElementById("memeTop").textContent = meme.top;
  document.getElementById("memeCaption").textContent = meme.caption;

  gifFallback.style.display = "none";
  memeGif.hidden = false;
  memeGif.alt = meme.caption;

  // Handle GIF links that are unavailable or blocked.
  memeGif.onerror = () => {
    memeGif.hidden = true;
    gifFallback.style.display = "block";
  };

  memeGif.src = meme.gif;

  modal.classList.add("show");
  document.body.classList.add("modal-open");
  document.getElementById("closeModal").focus();
}

function closeModal() {
  modal.classList.remove("show");
  document.body.classList.remove("modal-open");
}

document.getElementById("closeModal").addEventListener(
  "click", closeModal
);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modal.classList.contains("show")) {
    closeModal();
  }
});

function shareGame() {
  if (navigator.share) {
    navigator.share({
      title: "T.I.P. BINGO",
      text: "tara, T.I.P. BINGO tayo! 👀",
      url: window.location.href
    }).catch(() => {});
  } else if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(window.location.href)
      .then(() => {
        message.textContent = "link copied! send mo na sa friends mo 💛";
      })
      .catch(() => {
        message.textContent = "copy the page link and share it with friends!";
      });
  } else {
    message.textContent = "copy the page link and share it with friends!";
  }
}

newCard();
</script>
</body>
</html>
