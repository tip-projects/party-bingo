<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.I.P. BINGO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #FFFFFF;
      color: #000000;
    }

    .container {
      max-width: 440px;
      margin: auto;
    }

    .tag {
      display: inline-block;
      background: #FFC50B;
      color: #000000;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 34px;
      margin: 15px 0 8px;
      color: #000000;
    }

    p {
      color: #808285;
      font-size: 14px;
      line-height: 1.5;
    }

    .bingo {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin: 22px 0 16px;
    }

    .cell {
      min-width: 0;
      aspect-ratio: 1 / 1;
      padding: 3px;
      border: 2px solid #808285;
      border-radius: 10px;
      background: #FFFFFF;
      color: #000000;
      font-size: clamp(9px, 2.7vw, 12px);
      overflow-wrap: anywhere;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell.marked {
      background: #FFC50B;
      border-color: #000000;
      color: #000000;
    }

    .cell.free {
      background: #808285;
      border-color: #000000;
      color: #FFFFFF;
      font-weight: bold;
    }

    .cell.free.marked {
      background: #FFC50B;
      color: #000000;
    }

    .bingo-button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 2px solid #000000;
      border-radius: 14px;
      background: #FFC50B;
      color: #000000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .bingo-button:hover {
      background: #000000;
      color: #FFC50B;
    }

    .secondary {
      background: #FFFFFF;
      color: #000000;
      border: 2px solid #808285;
    }

    .secondary:hover {
      background: #808285;
      color: #FFFFFF;
    }

    #message {
      min-height: 28px;
      font-size: 17px;
      font-weight: bold;
      color: #000000;
    }

    .footer {
      font-size: 12px;
      margin-top: 20px;
      color: #808285;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>T.I.P. BINGO</h1>
    <p>
           Get five in a row to win!
    </p>

    <div class="bingo" id="board"></div>

    <p id="message" aria-live="polite">
      Good luck, T.I.P.ians!
    </p>

    <button class="bingo-button" onclick="newCard()">
      Reser Card
    </button>

    <button class="bingo-button secondary" onclick="shareGame()">
      Share with Friends
    </button>

    <p class="footer">
      Thank you for playing!
    </p>
  </main>

  <script>
    const prompts = [
        "nangutang sa plaza",
        "kumakain sa class",
        "laging late",
        "nanghihingi ng notes",
        "laging tulog sa class",
        "nagsasabing 'last na to'",
        "walang dalang ballpen",
        "nagtatanong kung may quiz",
        "laging nasa canteen",
        "may baong iced coffee",
        "nagcha-charge sa classroom",
        "nagtatanong kung uwian na",
        "FREE ⭐",
        "nagpapa-send ng PPT",
        "madalas may chika",
        "laging lowbat",
        "nagpapanggap na gets",
        "nagpapasa ng activity last minute",
        "nagti-TikTok sa hallway",
        "artistahin",
        "nag-aaya mag-plaza",
        "nagtatanong kung required pumasok",
        "nagcha-chat ng 'asan na kayo?'",
        "nag-aaral lang pag may quiz"
    ];

    const board = document.getElementById("board");
    const message = document.getElementById("message");
    let cells = [];

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function newCard() {
      board.innerHTML = "";
      cells = [];

      const shuffled = shuffle(prompts);

      for (let i = 0; i < 25; i++) {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.type = "button";

        if (i === 12) {
          cell.textContent = "FREE ★";
          cell.classList.add("free", "marked");
          cell.setAttribute("aria-pressed", "true");
        } else {
          const promptIndex = i < 12 ? i : i - 1;
          cell.textContent = shuffled[promptIndex];
          cell.setAttribute("aria-pressed", "false");
        }

        cell.addEventListener("click", () => {
          if (i === 12) return;

          cell.classList.toggle("marked");

          cell.setAttribute(
            "aria-pressed",
            cell.classList.contains("marked") ? "true" : "false"
          );

          checkBingo();
        });

        board.appendChild(cell);
        cells.push(cell);
      }

      message.textContent = "Good luck, T.I.P.ians";
    }

    function checkBingo() {
      const lines = [];

      for (let i = 0; i < 5; i++) {
        lines.push(
          [0, 1, 2, 3, 4].map(j => i * 5 + j),
          [0, 1, 2, 3, 4].map(j => j * 5 + i)
        );
      }

      lines.push(
        [0, 6, 12, 18, 24],
        [4, 8, 12, 16, 20]
      );

      const won = lines.some(line =>
        line.every(i => cells[i].classList.contains("marked"))
      );

      message.textContent = won
        ? "BINGO! YOU DID IT!"
        : "Keep going! You got this!";
    }

    function shareGame() {
      if (navigator.share) {
        navigator.share({
          title: "T.I.P. BINGO",
          text: "Come play Party Bingo with me!",
          url: window.location.href
        }).catch(() => {});
      } else {
        message.textContent =
          "Copy this page's link and send it to your friends!";
      }
    }

    newCard();
  </script>
</body>
</html>
